[project]
name = "portfolio-copilot"
version = "0.1.0"
description = "Backend brains of an assistant answering multi-step questions across a synthetic construction project portfolio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "openai>=1.54",
    "fastembed>=0.4",
    "sqlglot>=25.0",
    "mcp>=1.2,<2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "asyncpg-stubs>=0.30",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data/generated", "eval/results", ".fastembed_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "SIM", "RUF", "PL"]
ignore = [
    "PLR0913", "PLR2004", "RUF012",
    "PLR0917", "PLR0912", "PLR0915",  # the loop and the eval runner are explicit by design; complexity is visible
    "PLC0415",  # lazy imports: optional heavy deps (fastembed) and import cycles between app layers
    "RUF001",   # en dashes in synthetic document titles are intentional
    "N818",     # exception names are part of the PHASE 1 contracts (BudgetExceeded, RateLimited, ...)
    "S311",     # random is used for backoff jitter and the seeded synthetic corpus, not for security
    "UP046", "UP047",  # contracts keep explicit TypeVar generics
    "B008",     # FastAPI dependency-injection idiom (Depends/Query in defaults)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "S608", "E501"]
"scripts/**" = ["S101", "S608", "E501"]
"eval/**" = ["S101", "S603", "S607", "E501", "ASYNC240"]
"data/**" = ["E501"]
"app/orchestration/prompts.py" = ["E501"]  # prompt text
"app/tools/query_project_data.py" = ["E501"]  # prompt text

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "eval", "data/generator"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["fastembed.*", "sqlglot.*", "sse_starlette.*", "pgvector.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs Postgres (docker compose up -d db)",
    "live: needs GROQ_API_KEY; skipped otherwise",
]
